[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack_bolt"
dynamic = ["version", "readme", "authors"]
description = "The Bolt Framework for Python"
license = { text = "MIT" }
classifiers = [
	"Programming Language :: Python :: 3.7",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = ["slack_sdk>=3.38.0,<4"]


[project.urls]
Documentation = "https://docs.slack.dev/tools/bolt-python/"
Source = "https://github.com/slackapi/bolt-python"

[tool.setuptools.packages.find]
include = ["slack_bolt*"]

[tool.setuptools.dynamic]
version = { attr = "slack_bolt.version.__version__" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.distutils.bdist_wheel]
universal = true

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "W", "F", "D"]
ignore = [
	"F841",
	"F821",
	"E402",
	# missing-docstring: do not add docstrings where none exist (the only D rules ignored)
	"D100",
	"D101",
	"D102",
	"D103",
	"D104",
	"D105",
	"D106",
	"D107",
]

[tool.ruff.lint.pydocstyle]
# google convention resolves D203/D211 and D212/D213 conflicts and implicitly ignores
# D400/D401/D404/D413. Keep `select = ["D"]` a category select -- an explicit rule-code
# select would override the convention and resurface those rules.
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = []
asyncio_mode = "auto"

[tool.mypy]
files = "slack_bolt/"
force_union_syntax = true
warn_unused_ignores = true
